id: org.tuxistant.system
name: This computer
description: Tells you about this computer, such as how long it has been on and its IP address. Says what docker and systemd list about a name on your server, a Linux server with systemd and docker.service, and what runs on this computer, in their own words, and doesn't judge whether an app works
version: 1.0.0
permissions:
  files_read: true    # your IP address and Wi-Fi name are private, so a web search after them asks
  network: [home]     # system.running on your server: one fixed command that reads, over ssh
actions:
  system.info:
    description: Get facts about this computer. Use it for how long it has been on, its IP address, memory, how busy it is, battery, Wi-Fi, what is using the most CPU, or the operating system
    params:
      about:
        type: string
        enum: [uptime, ip, memory, cpu, battery, wifi, busiest, os]
        description: "Which fact the user asked about"
  system.running:
    description: Check whether a program or service is running, such as docker
    params:
      name: { type: string, description: "The program or service, in lower case" }
      "on": { type: string, description: "The other computer the user named, such as my server. Leave it out for this computer" }
    required: [name]
