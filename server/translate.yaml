# LibreTranslate for Tuxistant's translation skill, which looks for it on port 5000 of the server.
#   docker compose -f translate.yaml up -d
services:
  libretranslate:
    image: docker.io/libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    command: ["--disable-web-ui"]
    ports:
      - "5000:5000"
    environment:
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate-models:/home/libretranslate/.local   # downloaded once, kept across restarts

volumes:
  libretranslate-models:
